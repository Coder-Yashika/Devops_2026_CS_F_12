services:

  mongodb:
    image: mongo:8
    container_name: ods-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: ods-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/FSD-DevOps
      PORT: 5000
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: ods-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://ods-backend:5000
    depends_on:
      - backend

volumes:
  mongo_data: